    /* 3D 翻頁動畫 */
    @keyframes flipNextKeyframe {
      0% {
        transform: perspective(2000px) rotateY(-90deg);
        transform-origin: right center;
        opacity: 0;
        filter: drop-shadow(-20px 0px 10px rgba(0,0,0,0.6));
      }
      100% {
        transform: perspective(2000px) rotateY(0deg);
        transform-origin: right center;
        opacity: 1;
        filter: drop-shadow(0px 0px 0px rgba(0,0,0,0));
      }
    }

    @keyframes flipPrevKeyframe {
      0% {
        transform: perspective(2000px) rotateY(90deg);
        transform-origin: left center;
        opacity: 0;
        filter: drop-shadow(20px 0px 10px rgba(0,0,0,0.6));
      }
      100% {
        transform: perspective(2000px) rotateY(0deg);
        transform-origin: left center;
        opacity: 1;
        filter: drop-shadow(0px 0px 0px rgba(0,0,0,0));
      }
    }

    .flip-next-anim {
      animation: flipNextKeyframe 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .flip-prev-anim {
      animation: flipPrevKeyframe 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

      localStorage.setItem("mock_records", JSON.stringify(state.records));
      localStorage.setItem("mock_holidays", JSON.stringify(state.holidays));
    }

    // 計算特定日期區間的有效閱讀時間
    function parseDateTime(str) {
      if (!str) return null;
      const d = new Date(String(str).replace(" ", "T"));
      return isNaN(d.getTime()) ? null : d;
    }

    function calculateValidMinutes(startStr, endStr) {
      const start = parseDateTime(startStr);
      const end = parseDateTime(endStr);
      if (!start || !end || end < start) return 0;

      const holidaySet = new Set(state.holidays.map(h => h.date));
      let totalMinutes = 0;
      const current = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());

      while (current <= endDay) {
        const y = current.getFullYear();
        const m = String(current.getMonth() + 1).padStart(2, "0");
        const d = String(current.getDate()).padStart(2, "0");
        const dateKey = `${y}-${m}-${d}`;
        const dayOfWeek = current.getDay();

        if (dayOfWeek !== 0 && dayOfWeek !== 6 && !holidaySet.has(dateKey)) {
          const isStartDay = current.getTime() === new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
          const isEndDay = current.getTime() === endDay.getTime();
          const dayStartMin = isStartDay ? start.getHours() * 60 + start.getMinutes() : 0;
          const dayEndMin = isEndDay ? end.getHours() * 60 + end.getMinutes() : 1440;

          for (const slot of VALID_READING_INTERVALS) {
            const overlap = Math.max(0, Math.min(dayEndMin, slot.endMinute) - Math.max(dayStartMin, slot.startMinute));
            totalMinutes += overlap;
          }
        }
        current.setDate(current.getDate() + 1);
      }
      return totalMinutes;
    }

    function getNowString() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 格式化分類標題
    function formatCategoryName(name) {
      const parenIndex = name.indexOf("（");
      if (name.includes("：") && parenIndex !== -1) {
        const [prefix, rest] = name.split("：");
        const main = rest.slice(0, rest.indexOf("（"));
        const range = rest.slice(rest.indexOf("（"));
        return `<span class="block">${prefix}：</span><span class="block">${main}<span class="sm:block">${range}</span></span>`;
      }
      return name;
    }

    function naturalCompare(a, b) {
      return String(a || "").localeCompare(String(b || ""), undefined, { numeric: true, sensitivity: "base" });
    }

    function getBookCoverClass(book) {
      const sorted = [...state.books].sort((a, b) => naturalCompare(a.category, b.category) || naturalCompare(a.title, b.title));
      const idx = sorted.findIndex(b => b.id === book.id);
      const autoColor = BOOK_COVERS[(idx >= 0 ? idx : 0) % BOOK_COVERS.length];
      return book.coverLocked ? (book.cover || autoColor) : autoColor;
    }

    // --- 切換分頁 ---
    function switchTab(tab) {
      state.activeTab = tab;
      if (tab !== "wizards") state.selectedWizardId = null;
      if (tab !== "library") {
        state.pickingStudentId = null;
        state.selectedCategory = null;
      }
      render();

    // --- 借閱操作 ---
    function openBorrowModal(bookId) {
      state.contractBook = state.books.find(b => b.id === bookId);
      state.contractStudentId = "";
      render();
    }

    function directBorrowForPicking(bookId) {
      if (!state.pickingStudentId) return;
      const student = state.students.find(s => s.id === state.pickingStudentId);
      const book = state.books.find(b => b.id === bookId);
      if (!student || !book) return;

      const recId = "r" + Date.now();
      const borrowDate = getNowString();
      state.records.unshift({ id: recId, bookId: book.id, studentId: student.id, borrowDate, returnDate: null, status: "active" });
      book.status = "borrowed";
      book.borrowerId = student.id;

      state.successInfo = { title: book.title, student: student.name };
      state.activeTab = "wizards";
      state.selectedWizardId = student.id;
      state.pickingStudentId = null;
      state.selectedCategory = null;
      saveState();
      render();
    }

    function confirmBorrow() {
      if (!state.contractBook || !state.contractStudentId) return;
      const student = state.students.find(s => s.id === state.contractStudentId);
      const book = state.contractBook;
      const recId = "r" + Date.now();
      const borrowDate = getNowString();

      state.records.unshift({ id: recId, bookId: book.id, studentId: student.id, borrowDate, returnDate: null, status: "active" });
      book.status = "borrowed";
      book.borrowerId = student.id;

      state.successInfo = { title: book.title, student: student.name };
      state.contractBook = null;
      state.contractStudentId = "";
      saveState();
      render();
    }

    function returnBook(bookId, studentId) {
      const activeRec = state.records.find(r => r.bookId === bookId && r.studentId === studentId && r.status === "active");
      const book = state.books.find(b => b.id === bookId);
      const student = state.students.find(s => s.id === studentId);
      if (!book) return;

      const now = getNowString();
      let dur = 0;
      if (activeRec) {
        dur = calculateValidMinutes(activeRec.borrowDate, now);
        activeRec.returnDate = now;
        activeRec.durationMinutes = dur;
        activeRec.status = "returned";
      }
      book.status = "available";
      book.borrowerId = null;

      // 檢查修行達 30 分鐘以上獎勵 +10 魔力
      if (student) {
        const studentPastDurs = state.records
          .filter(r => r.studentId === student.id && r.bookId === bookId && r.status === "returned" && r.id !== activeRec?.id)
          .reduce((sum, r) => sum + (r.durationMinutes || 0), 0);
        const isDirect30Min = dur >= 30;
        const isAccumulated30Min = studentPastDurs < 30 && (studentPastDurs + dur) >= 30;
        const shouldReward = isDirect30Min || isAccumulated30Min;
        if (shouldReward) {
          student.magicPoints = (Number(student.magicPoints) || 0) + 10;
          if (activeRec) activeRec.rewarded = true;
        }
      }

      saveState();
      render();
    }

    function getSelectedHolidayDate() {
      const yearSel = document.getElementById("holiday-year-sel");
      const monthSel = document.getElementById("holiday-month-sel");
      const daySel = document.getElementById("holiday-day-sel");
      if (!yearSel || !monthSel || !daySel) return "";
      const y = yearSel.value;
      const m = monthSel.value.padStart(2, "0");
      const d = daySel.value.padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function onHolidayYearMonthChange() {
      const yearSel = document.getElementById("holiday-year-sel");
      const monthSel = document.getElementById("holiday-month-sel");
      const daySel = document.getElementById("holiday-day-sel");
      const dateIn = document.getElementById("holiday-date-in");
      if (!yearSel || !monthSel || !daySel) return;

      const y = parseInt(yearSel.value, 10);
      const m = parseInt(monthSel.value, 10);
      const daysInMonth = new Date(y, m, 0).getDate();

      const curDay = parseInt(daySel.value, 10) || 1;
      let dayHtml = "";
      for (let d = 1; d <= daysInMonth; d++) {
        const val = String(d).padStart(2, "0");
        dayHtml += `<option value="${val}">${val} 日</option>`;
      }
      daySel.innerHTML = dayHtml;
      daySel.value = String(Math.min(curDay, daysInMonth)).padStart(2, "0");

      if (dateIn) {
        dateIn.value = `${y}-${String(m).padStart(2, "0")}-${daySel.value}`;
      }
      updateHolidayWeekdayPreview();
    }

    function onHolidayDateInputChange(val) {
      if (!val) return;
      const parts = val.split("-");
      if (parts.length !== 3) return;
      const [y, m, d] = parts;
      const yearSel = document.getElementById("holiday-year-sel");
      const monthSel = document.getElementById("holiday-month-sel");
      const daySel = document.getElementById("holiday-day-sel");
      if (yearSel && monthSel && daySel) {
        yearSel.value = y;
        monthSel.value = m;
        const daysInMonth = new Date(parseInt(y, 10), parseInt(m, 10), 0).getDate();
        let dayHtml = "";
        for (let i = 1; i <= daysInMonth; i++) {
          const v = String(i).padStart(2, "0");
          dayHtml += `<option value="${v}">${v} 日</option>`;
        }
        daySel.innerHTML = dayHtml;
        daySel.value = d;
      }
      updateHolidayWeekdayPreview();
    }

    function setHolidayQuickDate(offsetDays = 0) {
      const d = new Date();
      if (offsetDays !== 0) {
        d.setDate(d.getDate() + offsetDays);
      }
      const y = String(d.getFullYear());
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const dayVal = String(d.getDate()).padStart(2, "0");

      const yearSel = document.getElementById("holiday-year-sel");
      const monthSel = document.getElementById("holiday-month-sel");
      const daySel = document.getElementById("holiday-day-sel");
      const dateIn = document.getElementById("holiday-date-in");

      if (yearSel && monthSel && daySel) {
        yearSel.value = y;

        const daysInMonth = new Date(parseInt(y, 10), parseInt(m, 10), 0).getDate();
        let dayHtml = "";
        for (let i = 1; i <= daysInMonth; i++) {
          const v = String(i).padStart(2, "0");
          dayHtml += `<option value="${v}">${v} 日</option>`;
        }
        daySel.innerHTML = dayHtml;
        daySel.value = dayVal;
      }

        dateIn.value = `${y}-${m}-${dayVal}`;
      }
      updateHolidayWeekdayPreview();
    }

    function updateHolidayWeekdayPreview() {
      const previewSpan = document.getElementById("holiday-weekday-preview");
      if (!previewSpan) return;
      const curDate = getSelectedHolidayDate();
      if (!curDate) {
        previewSpan.textContent = "";
        return;
      }
      const parts = curDate.split("-");
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      if (isNaN(d.getTime())) {
        previewSpan.textContent = "";
        return;
      }
      const weekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
      const w = weekdays[d.getDay()];
      const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
      previewSpan.innerHTML = `已選擇：<strong class="text-amber-400 font-bold text-sm ml-1">${curDate} (${w})</strong>${isWeekend ? ' <span class="text-amber-400/80 bg-amber-950/50 px-2 py-0.5 rounded border border-amber-800/40 text-xs ml-2">※ 提示：此日已是週末，系統本來就不會計算借閱，仍可加入備註</span>' : ''}`;
    }

    function formatHolidayDateDisplay(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      if (parts.length === 3) {
        const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        if (!isNaN(d.getTime())) {
          const weekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
          return `${dateStr} (${weekdays[d.getDay()]})`;
        }
      }
      return dateStr;
    }

    function renderAdminBooksList(filter = "") {

      return filtered.map(b => {
        const cover = getBookCoverClass(b);
        return `
          <div class="bg-black/40 rounded-xl p-4 border border-slate-700/60 flex flex-col sm:flex-row sm:items-center gap-3 hover:border-emerald-700/50 transition-colors">
            <div class="flex items-center gap-3 min-w-0 flex-1">

              <div class="min-w-0 flex-1">
                <h4 class="font-bold text-slate-100 text-sm sm:text-base truncate">
                  ${b.title} ${b.copyTotal > 1 ? `<span class="ml-2 text-[11px] font-bold text-amber-400/90 bg-amber-900/30 px-1.5 py-0.5 rounded border border-amber-800/40 align-middle">複本 ${b.copyNo}/${b.copyTotal}</span>` : ''}
                </h4>
                <p class="text-xs text-slate-400 mt-1 truncate">${b.category}・${b.author}</p>
              </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-2 shrink-0">
              <span class="text-xs font-bold px-2.5 py-1 rounded-md ${b.status === 'borrowed' ? 'text-rose-300 bg-rose-900/30 border border-rose-700/40' : 'text-sky-300 bg-sky-900/30 border border-sky-700/40'}">
                ${b.status === 'borrowed' ? '借出中' : '可借閱'}
              </span>
              ${b.status === 'borrowed' ? `<button onclick="forceReleaseBook('${b.id}')" class="px-2.5 py-1.5 text-xs font-bold text-emerald-300 bg-emerald-900/30 hover:bg-emerald-800/50 rounded-lg border border-emerald-700/50">釋放</button>` : ''}

              <button onclick="deleteBook('${b.id}')" class="p-2.5 text-slate-500 hover:text-rose-400">🗑️</button>
            </div>
          </div>
        `;
      }).join("");
    }

      if (state.successInfo) {
        html += `
          <div onclick="state.successInfo=null; render();" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[60] p-4">
            <div onclick="event.stopPropagation();" class="glass-panel border-2 border-emerald-400/60 rounded-3xl p-8 sm:p-10 max-w-md w-full text-center shadow-[0_0_40px_rgba(16,185,129,0.4)]">
              <div class="w-20 h-20 mx-auto mb-5 rounded-full bg-emerald-500/20 border-2 border-emerald-400/60 flex items-center justify-center text-3xl shadow-[0_0_25px_rgba(16,185,129,0.5)]">
                ✓
              </div>
              <h3 class="text-2xl sm:text-3xl font-black text-emerald-300 mb-3 tracking-wider">借閱成功！</h3>
              <p class="text-slate-200 text-base sm:text-lg font-bold mb-1 break-all">${state.successInfo.title}</p>
              ${state.successInfo.student ? `<p class="text-slate-400 text-sm sm:text-base mb-6">已借給 <span class="text-amber-300 font-bold">${state.successInfo.student}</span></p>` : ''}
              <button onclick="state.successInfo=null; render();" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-2xl border border-emerald-300/50 font-black text-lg shadow-[0_10px_25px_rgba(4,120,87,0.4)]">好的</button>
            </div>
          </div>
        `;
      }

      // 3. 收錄新書彈窗
      if (state.isAddBookOpen) {
        html += `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
            <div class="glass-panel border-2 border-emerald-700 rounded-2xl p-6 w-full max-w-md shadow-[0_0_40px_rgba(4,120,87,0.3)] relative max-h-[90vh] overflow-y-auto">
              <button onclick="state.isAddBookOpen=false; render();" class="absolute top-4 right-4 text-slate-400 hover:text-emerald-400">✕</button>
              <h2 class="text-2xl sm:text-3xl font-bold text-emerald-400 mb-2 flex items-center justify-center">📖 收錄新魔導書</h2>
              <form onsubmit="event.preventDefault(); createNewBook(document.getElementById('new-b-title').value, document.getElementById('new-b-author').value, document.getElementById('new-b-cat').value, document.getElementById('new-b-copies').value);" class="space-y-4 my-6">
                <div>
                  <label class="block text-xs font-bold text-emerald-500/80 mb-1">書名 (必填)：</label>
                  <input id="new-b-title" type="text" placeholder="例如：哈利波特" required class="w-full bg-slate-900/80 border-2 border-slate-700 text-slate-100 rounded-xl p-3 focus:outline-none focus:border-emerald-500 shadow-inner" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-emerald-500/80 mb-1">作者：</label>
                  <input id="new-b-author" type="text" placeholder="例如：J.K. 羅琳" class="w-full bg-slate-900/80 border-2 border-slate-700 text-slate-100 rounded-xl p-3 focus:outline-none focus:border-emerald-500 shadow-inner" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-emerald-500/80 mb-1">類別：</label>
                  <select id="new-b-cat" class="w-full bg-slate-900/80 border-2 border-slate-700 text-slate-100 rounded-xl p-3 focus:outline-none focus:border-emerald-500 shadow-inner">
                    ${state.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-emerald-500/80 mb-1">複本數量：</label>
                  <input id="new-b-copies" type="number" min="1" max="20" value="1" class="w-full bg-slate-900/80 border-2 border-slate-700 text-slate-100 rounded-xl p-3 focus:outline-none focus:border-emerald-500 shadow-inner" />
                </div>
                <button type="submit" class="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-emerald-600 to-emerald-500 text-white shadow-[0_0_20px_rgba(4,120,87,0.5)] border border-emerald-300">確認收錄</button>
              </form>
            </div>
          </div>
        `;
      }

      // 4. 重置禁忌魔法彈窗
      if (state.isResetOpen) {
        html += `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
            <div class="glass-panel border-2 border-rose-700 rounded-3xl p-8 w-full max-w-md shadow-[0_0_50px_rgba(225,29,72,0.4)] relative text-center">
              <h2 class="text-2xl sm:text-3xl font-black text-rose-500 mb-5 flex items-center justify-center">⚠️ 禁忌魔法警告</h2>
              <p class="text-slate-200 mb-8 text-sm sm:text-base font-medium leading-relaxed">
                您即將歸零 <strong class="text-rose-400 text-lg mx-1">所有學徒的魔力值</strong><br />
                並銷毀 <strong class="text-rose-400 text-lg mx-1">全部的修行日誌</strong>。<br /><br />
                確定要釋放這個無法逆轉的魔法嗎？
              </p>
              <div class="flex gap-4">
                <button onclick="state.isResetOpen=false; render();" class="flex-1 py-3 bg-black/50 hover:bg-slate-800 text-slate-300 rounded-xl font-bold border border-slate-600">取消施法</button>
                <button onclick="resetAllData(); state.isResetOpen=false; render();" class="flex-1 py-3 bg-gradient-to-r from-rose-800 to-rose-600 text-rose-50 rounded-xl font-bold shadow-[0_0_20px_rgba(225,29,72,0.5)]">確認摧毀</button>
              </div>
            </div>
          </div>
        `;
      }

      modal.innerHTML = html;
    }

    // --- 管理輔助操作 ---
    function updateStudentField(id, field, value) {
      const s = state.students.find(st => st.id === id);
      if (s) {
        s[field] = value;
        saveState();
      }
    }

    function addNewStudent() {
      const nextSeat = state.students.length > 0 ? Math.max(...state.students.map(s => Number(s.seatNumber) || 0)) + 1 : 1;
      const avatar = WIZARD_AVATARS[Math.floor(Math.random() * WIZARD_AVATARS.length)];
      state.students.push({
        id: "s" + Date.now(),
        seatNumber: String(nextSeat),
        name: "新學徒",
        avatar,
        magicPoints: 0
      });
      saveState();
      render();
    }

    function deleteStudent(id) {
      if (confirm("確定要將這位學徒從名冊中除名嗎？")) {
        state.students = state.students.filter(s => s.id !== id);
        saveState();
        render();
      }
    }

    function createCategory() {
      const el = document.getElementById("new-cat-input");
      if (!el || !el.value.trim()) return;
      const val = el.value.trim();
      if (state.categories.some(c => c.name === val)) {
        alert("已經有同名的類別了。");
        return;
      }
      state.categories.push({ id: "c" + Date.now(), name: val, order: state.categories.length });
      el.value = "";
      saveState();
      render();
    }

    function renameCategory(id, newName) {
      const c = state.categories.find(cat => cat.id === id);
      if (c && newName.trim() && newName.trim() !== c.name) {
        const old = c.name;
        c.name = newName.trim();
        state.books.forEach(b => { if (b.category === old) b.category = c.name; });
        saveState();
        render();
      }
    }

    function deleteCategory(id) {
      const c = state.categories.find(cat => cat.id === id);
      if (!c) return;
      const cnt = state.books.filter(b => b.category === c.name).length;
      if (cnt > 0) {
        alert(`「${c.name}」底下還有 ${cnt} 本書，請先把這些書改分類或刪除，才能刪除此類別。`);
        return;
      }
      if (confirm(`確定要刪除類別「${c.name}」嗎？`)) {
        state.categories = state.categories.filter(cat => cat.id !== id);
        saveState();
        render();
      }
    }

    function createNewBook(title, author, category, copies) {
      const trimmed = title.trim();
      if (!trimmed) return;
      const formattedTitle = trimmed.includes("《") ? trimmed : `《${trimmed}》`;
      const numCopies = Math.max(1, Math.min(20, parseInt(copies, 10) || 1));
      const auth = author.trim() || "未知學者";
      const cat = category || state.categories[0]?.name || "魔法";
      const baseId = Date.now();

      for (let i = 0; i < numCopies; i++) {
        state.books.push({
          id: `b${baseId}_${i + 1}`,
          title: formattedTitle,
          author: auth,
          category: cat,
          copyNo: i + 1,
          copyTotal: numCopies,
          cover: BOOK_COVERS[Math.floor(Math.random() * BOOK_COVERS.length)],
          status: "available",
          borrowerId: null
        });
      }
      state.isAddBookOpen = false;
      saveState();
      render();
    }

    function deleteBook(id) {
      const b = state.books.find(bk => bk.id === id);
      if (!b) return;
      if (b.status === "borrowed") {
        alert("這本書正被借走，請先歸還再刪除。");
        return;
      }
      if (confirm(`確定要永久刪除「${b.title}」嗎？`)) {
        state.books = state.books.filter(bk => bk.id !== id);
        saveState();
        render();
      }
    }

    function forceReleaseBook(id) {
      const b = state.books.find(bk => bk.id === id);
      if (!b) return;
      if (confirm(`確定要強制釋放「${b.title}」嗎？這會把書放回可借閱。`)) {
        b.status = "available";
        b.borrowerId = null;
        saveState();
        render();
      }
    }

    function runBatchImport() {
      const el = document.getElementById("admin-batch-textarea");
      if (!el || !el.value.trim()) return;
      const lines = el.value.split("\n").map(l => l.trim()).filter(Boolean);
      let count = 0;

      lines.forEach((line, idx) => {
        const parts = line.split("/").map(p => p.trim());
        const t = parts[0];
        if (!t || t === "書名") return;
        const auth = parts[1] || "未知學者";
        const cat = parts[2] || state.categories[0]?.name || "一般藏書";
        const copies = Math.max(1, Math.min(20, parseInt(parts[3], 10) || 1));
        const formattedTitle = t.includes("《") ? t : `《${t}》`;
        const baseId = Date.now() + "_" + idx;

        for (let c = 0; c < copies; c++) {
          state.books.push({
            id: `b${baseId}_${c + 1}`,
            title: formattedTitle,
            author: auth,
            category: cat,
            copyNo: c + 1,
            copyTotal: copies,
            cover: BOOK_COVERS[Math.floor(Math.random() * BOOK_COVERS.length)],
            status: "available",
            borrowerId: null
          });
          count++;
        }
      });

      alert(`成功匯入 ${count} 本藏書！`);
      el.value = "";
      saveState();
      render();
    }

    function resetAllData() {
      state.records = [];
      state.students.forEach(s => s.magicPoints = 0);
      state.books.forEach(b => { b.status = "available"; b.borrowerId = null; });
      saveState();
      alert("重置完成！全體學徒魔力值已歸零，書籍皆已回收。");
      render();
    }

    // 初次載入渲染
    render();
  </script>
</body>
</html>
